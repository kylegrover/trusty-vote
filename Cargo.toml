[package]
name = "trusty-vote"
version = "0.2.0"
edition = "2024"

[dependencies]
# Discord API
serenity = { version = "0.11", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
tokio = { version = "1.21", features = ["macros", "rt-multi-thread"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
dotenvy = "0.15"

# Crypto (STAR tie-breaking)
sha2 = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.9"
uuid = { version = "1.1", features = ["v4", "serde"] }
thiserror = "1.0"
regex = "1.5"
lazy_static = "1.4"

# Optional: Embedded Postgres for local dev
postgresql_embedded = { version = "0.18", optional = true }

[features]
embedded-postgres = ["postgresql_embedded"]
