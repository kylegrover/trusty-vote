services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trusty_vote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trusty_vote"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgres://postgres:postgres@db:5432/trusty_vote
      RUST_LOG: ${RUST_LOG:-info}

volumes:
  postgres_data: